name: build
on:
  workflow_dispatch:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go build -o /dev/null .
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...
      - name: Version matches the changelog
        run: |
          v=$(sed -n 's/^const version = "\(.*\)"/\1/p' main.go)
          grep -q "^## $v" CHANGELOG.md || { echo "CHANGELOG.md has no entry for $v"; exit 1; }
          grep -q "mattermost-agent-registrar:$v$" .github/workflows/build.yml || { echo "image tag is not $v"; exit 1; }
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/dembaca/mattermost-agent-registrar:0.2.0
            ghcr.io/dembaca/mattermost-agent-registrar:latest
